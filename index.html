<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBay Profit Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f1f4f9;
    color: #1f2937;
    display: flex;
    justify-content: center;
    padding: 20px 14px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .brand {
    text-align: center; font-weight: 800; font-size: 1.1rem; letter-spacing: .04em;
    color: #2563eb; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid #e5e7eb;
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .sub { margin: 0 0 20px; color: #6b7280; font-size: .9rem; }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 14px 0 6px; }
  label span { font-weight: 400; color: #9ca3af; }
  .field { position: relative; }
  .field i {
    position: absolute; top: 50%; transform: translateY(-50%);
    color: #6b7280; font-style: normal; pointer-events: none;
  }
  .field .pre { left: 14px; }
  .field .suf { right: 14px; }
  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem; /* 16px stops iPhone zooming on focus */
    border: 1.5px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .gbp input { padding-left: 30px; }
  .pct input { padding-right: 34px; }
  input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .results { margin-top: 24px; border-top: 1px solid #e5e7eb; padding-top: 18px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: .95rem; }
  .row b { font-variant-numeric: tabular-nums; }
  .row small { color: #9ca3af; font-size: .75rem; }
  .profit {
    margin-top: 12px; padding: 16px; border-radius: 12px;
    text-align: center; background: #f3f4f6;
  }
  .profit small { display: block; color: #6b7280; font-size: .8rem; margin-bottom: 4px; }
  .profit .big { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pos { color: #16a34a; }
  .neg { color: #dc2626; }
  .profit.pos-bg { background: #f0fdf4; }
  .profit.neg-bg { background: #fef2f2; }
  .note { margin-top: 14px; font-size: .75rem; color: #9ca3af; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Ecommerce Solvers</div>
  <h1>eBay Profit Calculator</h1>
  <p class="sub">Work out what you really keep on each sale.</p>

  <label for="price">eBay selling price</label>
  <div class="field gbp"><i class="pre">£</i><input id="price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>

  <label for="cost">AliExpress product cost</label>
  <div class="field gbp"><i class="pre">£</i><input id="cost" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>

  <label for="ship">Shipping cost</label>
  <div class="field gbp"><i class="pre">£</i><input id="ship" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>

  <label for="fee">eBay fee percentage</label>
  <div class="field pct"><input id="fee" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 12.8"><i class="suf">%</i></div>

  <label for="ad">Promoted listing ad rate <span>(optional)</span></label>
  <div class="field pct"><input id="ad" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"><i class="suf">%</i></div>

  <div class="results">
    <div class="row"><span>Total fees</span><b id="fees">£0.00</b></div>
    <div class="row"><span>Profit margin</span><b id="margin">0.00%</b></div>
    <div class="row"><span>ROI <small>(profit / product + shipping cost)</small></span><b id="roi">0.00%</b></div>
    <div class="profit" id="profitBox">
      <small>Net profit</small>
      <div class="big" id="profit">£0.00</div>
    </div>
    <p class="note">Fees and ad rate are both taken as a % of the selling price.</p>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const ids = ["price", "cost", "ship", "fee", "ad"];
  const num = id => parseFloat($(id).value) || 0;
  const gbp = n => (n < 0 ? "-£" : "£") + Math.abs(n).toFixed(2);

  function calculate() {
    const price = num("price");
    const fees = price * (num("fee") + num("ad")) / 100;
    const profit = price - num("cost") - num("ship") - fees;
    const margin = price > 0 ? (profit / price) * 100 : 0;

    $("fees").textContent = gbp(fees);
    $("profit").textContent = gbp(profit);
    $("margin").textContent = margin.toFixed(2) + "%";

    const outlay = num("cost") + num("ship");
    $("roi").textContent = (outlay > 0 ? (profit / outlay) * 100 : 0).toFixed(2) + "%";

    const cls = profit > 0 ? "pos" : profit < 0 ? "neg" : "";
    $("profit").className = "big " + cls;
    $("margin").className = cls;
    $("profitBox").className = "profit " + (cls ? cls + "-bg" : "");
  }

  ids.forEach(id => $(id).addEventListener("input", calculate));
  calculate();
</script>
</body>
</html>
